name: Diagnostic réseau
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.escrime-info.com/gregxml/Greg/BD/services/service.php/derniersResultats?jours=400" "https://www.escrime-info.com/" "https://www.ffescrime.fr/" "https://www.ffescrime.fr/competitions/"; do
            echo "== $u"; curl -sSL -m 30 -o /tmp/o -w "code=%{http_code} size=%{size_download}\n" -A "Mozilla/5.0" "$u" || true; head -c 200 /tmp/o; echo
          done
          echo "== sans user-agent"; curl -sSL -m 30 -o /tmp/o -w "code=%{http_code}\n" "https://www.escrime-info.com/gregxml/Greg/BD/services/service.php/derniersResultats?jours=400"; head -c 200 /tmp/o
