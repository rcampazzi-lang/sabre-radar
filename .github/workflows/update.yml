name: Mise à jour des données
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full, live ou comp"
        required: true
        default: live
      keys:
        description: "Clés de compétitions (mode comp), séparées par des virgules"
        required: false
        default: ""
concurrency:
  group: maj-sabre-radar
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Outils (PDF, OCR)
        if: inputs.mode == 'full'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-fra
      - name: Mise à jour
        env:
          MODE: ${{ inputs.mode }}
          KEYS: ${{ inputs.keys }}
        run: python3 tools/ci.py "$MODE" "$KEYS"
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name "Sabre Radar"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Rien à publier"; exit 0; fi
          git commit -qm "Mise à jour automatique ($MODE) du $(TZ=Europe/Paris date +%d/%m/%Y' '%H:%M)"
          git pull -q --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
